<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191317" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Reservo — аудитории, переговорные, места в коворкингах и оборудование университета. Нашёл свободное — забронировал за 30 секунд." />
    <title>Reservo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Unbounded:wght@500..700&display=swap" />
    <script>
      // Тема ставится до загрузки приложения, чтобы страница не мигнула светлой.
      try {
        var t = localStorage.getItem('reservo.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
