name: reservo

services:
  db:
    image: postgres:18-alpine
    container_name: reservo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservo}
      POSTGRES_USER: ${POSTGRES_USER:-reservo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservo_dev}
    ports:
      # Только localhost: база никогда не должна быть доступна снаружи.
      # Порт хоста 5433, потому что 5432 может быть занят локально установленным PostgreSQL.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Образы postgres:18 хранят данные в /var/lib/postgresql (а не в .../data, как в старых инструкциях).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
