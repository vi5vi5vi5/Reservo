# ============================================================
#  Reservo за общим nginx (MeetUp).
#
#  Файл кладётся НЕ СЮДА, а на сторону сервиса, который держит порты 80 и 443:
#
#      MeetUp/Server/proxy/extra/reservo.conf
#
#  Порт 80 и ACME-challenge обслуживает сам MeetUp: он отдаёт проверку Let's Encrypt
#  и перенаправляет всё остальное на https. Здесь — только https.
#  Сертификат общий: certbot выписывает его сразу на все имена (--extra-domain в update.sh MeetUp).
# ============================================================

# Заголовок Connection для WebSocket. Префикс reservo_ — чтобы не столкнуться с такой же
# переменной соседей (у Ferry — $ferry_connection_upgrade).
map $http_upgrade $reservo_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name reservo.fferry.ru;

    # Встроенный DNS docker — для адреса через переменную ниже.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Адрес Reservo через переменную, а не напрямую: nginx разрешает имя на каждый запрос.
    # Напиши proxy_pass http://reservo-api:8080 — и выключенный Reservo не дал бы стартовать
    # всему nginx («host not found in upstream»), уронив заодно MeetUp и Ferry.
    # С переменной выключенный Reservo просто отвечает 502, а соседи работают.
    set $reservo_upstream http://reservo-api:8080;

    ssl_certificate     /etc/nginx/certs/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/privkey.pem;

    # Запросы API маленькие (JSON); запас — на будущую загрузку фото ресурсов.
    client_max_body_size 10m;

    # Сжатие: фронтенд — около 400 КБ JS и CSS, в gzip остаётся примерно четверть.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Живые обновления (SignalR): WebSocket с апгрейдом и длинными таймаутами —
    # соединение висит, пока открыта вкладка, и может долго молчать.
    location /hubs/ {
        proxy_pass $reservo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $reservo_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Всё остальное: сайт (фронтенд), /api, /swagger, /health, /demo/.
    location / {
        proxy_pass $reservo_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
